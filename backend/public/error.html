<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — ATS İÜ</title>
  <link rel="icon" href="/emblem.svg" type="image/svg+xml">
  <script src="/i18n.js"></script>
  <link rel="stylesheet" href="/workspace.css">
  <script>
    try {
      const saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {}
  </script>
</head>
<body>
  <header class="site"><div class="bar"><a class="brand" href="/" aria-label="ATS İÜ Alumni Network, home">
    <span class="brand-mark" aria-hidden="true"></span><span>ATS İÜ<small>Alumni Network</small></span>
  </a></div></header>
  <main><section class="card missing narrow">
    <p class="code">404</p>
    <h1>Page not found</h1><p class="sub" id="reason">The page you requested could not be found.</p>
    <a class="btn" href="/">Back to the home page</a>
    <a class="btn quiet" href="/platform">Open workspace</a>
  </section></main>
  <script>
    const from = new URLSearchParams(location.search).get('from');
    i18n.translatePage();
    if (from && from.startsWith('/') && !from.startsWith('//') && from.length <= 200) document.getElementById('reason').textContent = i18n.t('No page was found at {path}.', { path: from });
  </script>
</body>
</html>

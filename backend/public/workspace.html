<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace — ATS İÜ</title>
  <link rel="icon" href="/emblem.svg" type="image/svg+xml">
  <script>
    try {
      const saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved :
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {}
  </script>
  <script src="/i18n.js"></script>
  <script src="/account.js" defer></script>
  <link rel="stylesheet" href="/workspace.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <div class="bar">
      <a class="brand" href="/" aria-label="ATS İÜ Alumni Network, home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>ATS <span lang="tr">İÜ</span><small>Alumni Network</small></span>
      </a>
      <button class="workspace-menu" type="button" aria-controls="workspace-nav" aria-expanded="false" hidden>Menu</button>
      <nav class="nav" id="workspace-nav" aria-label="Platform">
        <a href="/">Home</a>
        <a href="/platform">Workspace</a>
        <a href="/job-postings">Opportunities</a>
        <a href="/announcements">Announcements</a>
        <a href="/about">About</a>
        <button class="lang-toggle lang-in-menu" type="button" data-style="full" hidden></button>
      </nav>
      <a class="bar-action account-action" href="/login">Log in</a>
      <button class="lang-toggle lang-in-header" type="button" hidden></button>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p class="meta" id="loading" role="status">Loading workspace…</p>
    <noscript><p>Enable JavaScript to open the workspace. <a href="/">Return to the alumni home page</a>.</p></noscript>
  </main>
  <footer class="site-foot">
    <a href="/" lang="tr">İstanbul Üniversitesi</a>
    <nav aria-label="Additional resources"><a href="/about">About</a><a href="/api/swagger">API docs</a><a href="/api/health">System status</a></nav>
  </footer>
  <script>
    i18n.translatePage(); // header and footer text in the chosen language (i18n.js)
    const themeButton = document.querySelector('.theme-toggle');
    const themeRoot = document.documentElement;
    function setThemeLabel() {
      themeButton.setAttribute('aria-label', i18n.t(themeRoot.dataset.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'));
    }
    themeButton.hidden = false;
    setThemeLabel();
    themeButton.addEventListener('click', () => {
      themeRoot.dataset.theme = themeRoot.dataset.theme === 'dark' ? 'light' : 'dark';
      setThemeLabel();
      try { localStorage.setItem('theme', themeRoot.dataset.theme); } catch {}
    });
    const menuButton = document.querySelector('.workspace-menu');
    const compact = matchMedia('(max-width: 75rem)');
    function setMenu(open) {
      menuButton.hidden = !compact.matches;
      document.querySelector('#workspace-nav').hidden = compact.matches && !open;
      menuButton.setAttribute('aria-expanded', String(open));
    }
    setMenu(false);
    compact.addEventListener('change', () => setMenu(false));
    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') {
        setMenu(false);
        menuButton.focus();
      }
    });
  </script>
  <template id="platform-page"><section class="workspace-intro">
  <div>
    <p class="kicker">Alumni Tracking System</p>
    <h1>The alumni <em>workspace.</em></h1>
    <p>Read university news, explore career opportunities and manage the records that keep the community connected.</p>
    <a class="btn" href="/job-postings">Browse opportunities <span aria-hidden="true">→</span></a>
  </div>
  <img src="/media/beginning.webp" width="1600" height="1000" alt="Students spending time together on campus">
</section>
<nav class="places" aria-label="Workspace sections">
  <a href="/announcements"><h2>Announcements</h2><p>Read and publish news for the alumni community.</p><span aria-hidden="true">↗</span></a>
  <a href="/job-postings"><h2>Career opportunities</h2><p>Browse openings and share a position.</p><span aria-hidden="true">↗</span></a>
  <a href="/job-applications"><h2>Applications</h2><p>Review applications and follow their status.</p><span aria-hidden="true">↗</span></a>
  <a href="/users"><h2>Users</h2><p>Manage user records, roles and account status.</p><span aria-hidden="true">↗</span></a>
</nav>
<details class="resources">
  <summary>Developer resources</summary>
  <nav aria-label="Developer resources"><a href="/api/swagger">API documentation</a><a href="/api/health">Service health</a><a href="/hello">Hello</a><a href="/hello/alumni">Named greeting</a><a href="/sum/2/3">Sum</a></nav>
</details></template>
<template id="about-page"><section class="workspace-intro">
  <div>
    <p class="kicker">About ATS İÜ</p>
    <h1>A shared <em>beginning.</em></h1>
    <p>The Alumni Tracking System connects İstanbul University’s graduates with university announcements, job postings and the people who share their history.</p>
    <a class="btn" href="/platform">Enter the workspace <span aria-hidden="true">→</span></a>
  </div>
  <img src="/media/connection.webp" width="1600" height="1000" alt="People spending time together outdoors">
</section></template>
  <script type="module" src="/workspace.js"></script>
</body>
</html>

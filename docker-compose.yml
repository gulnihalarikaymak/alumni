# The whole system comes up with a single command:
#   docker compose up
#
# db and backend run since week 02. The frontend joins in week 10.
#
# Persistence: PostgreSQL writes its files to the named volume "alumni-db-data",
# which lives outside the container. `docker compose down` removes the containers
# but keeps the volume, so the data survives a restart. Only `down -v` deletes it.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumni}
      POSTGRES_USER: ${POSTGRES_USER:-alumni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker, so the
      # volume is mounted on the parent folder (not .../data as in version 17 and older).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      # Used by Prisma from week 5. "db" is the service name above: inside the
      # compose network the backend reaches PostgreSQL by that name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-alumni}:${POSTGRES_PASSWORD:-alumni}@db:5432/${POSTGRES_DB:-alumni}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # frontend:  React SPA (nginx) -- from week 10

volumes:
  db-data:
    # A fixed name, so the volume does not depend on the project folder name
    # and is easy to find with `docker volume ls`.
    name: alumni-db-data

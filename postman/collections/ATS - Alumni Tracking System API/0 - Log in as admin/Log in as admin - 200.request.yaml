$kind: http-request
name: Log in as admin -> 200
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("logged in as an ADMIN", () => pm.expect(pm.response.json().user.role).to.eql("ADMIN"));
    language: text/javascript
order: 1000

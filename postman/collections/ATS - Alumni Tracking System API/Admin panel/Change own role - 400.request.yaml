$kind: http-request
name: Change own role -> 400 (an admin cannot lock themselves out)
url: "{{baseUrl}}/api/users/{{adminId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "STUDENT"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000

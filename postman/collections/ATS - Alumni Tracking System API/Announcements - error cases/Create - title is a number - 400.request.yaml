$kind: http-request
name: Create - title is a number -> 400
url: "{{baseUrl}}/api/announcements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": 123,
      "content": "text"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000

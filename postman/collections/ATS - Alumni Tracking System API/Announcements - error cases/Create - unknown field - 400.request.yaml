$kind: http-request
name: Create - unknown field -> 400
url: "{{baseUrl}}/api/announcements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "a",
      "content": "b",
      "id": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000

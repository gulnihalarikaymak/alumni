$kind: http-request
name: PUT - missing content -> 400
url: "{{baseUrl}}/api/announcements/{{annId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Only a title"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000

$kind: http-request
name: Setup - create announcement -> 201
url: "{{baseUrl}}/api/announcements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman test",
      "content": "Created by the error-case folder"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("annId", pm.response.json().id);
    language: text/javascript
order: 1000

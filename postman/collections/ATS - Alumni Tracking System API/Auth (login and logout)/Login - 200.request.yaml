$kind: http-request
name: Login -> 200 (sets the ats_session cookie)
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{loginEmail}}",
      "password": "test-password-1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("session cookie is set", () => pm.expect(pm.cookies.has("ats_session")).to.be.true);
    language: text/javascript
order: 6000

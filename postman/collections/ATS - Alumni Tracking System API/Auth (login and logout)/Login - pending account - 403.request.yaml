$kind: http-request
name: Login - pending account -> 403
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{loginEmail}}",
      "password": "test-password-1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000

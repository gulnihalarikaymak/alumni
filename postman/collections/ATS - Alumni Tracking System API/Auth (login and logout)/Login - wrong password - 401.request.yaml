$kind: http-request
name: Login - wrong password -> 401
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{loginEmail}}",
      "password": "not-the-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000

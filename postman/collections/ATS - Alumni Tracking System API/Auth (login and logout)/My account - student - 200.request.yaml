$kind: http-request
name: My account - student -> 200 (own data only)
url: "{{baseUrl}}/api/account"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("the page is about the logged-in user", () => pm.expect(body.user.email).to.eql(pm.collectionVariables.get("loginEmail")));
      pm.test("a student has applications but no alumni profile", () => {
        pm.expect(body.applications).to.be.an("array");
        pm.expect(body.alumniProfile).to.eql(null);
      });
    language: text/javascript
order: 7200

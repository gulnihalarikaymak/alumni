$kind: http-request
name: GET /hello/:name
url: "{{baseUrl}}/hello/Gulnihal"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("body", () => pm.expect(pm.response.text()).to.eql("hello Gulnihal"));
    language: text/javascript
order: 4000

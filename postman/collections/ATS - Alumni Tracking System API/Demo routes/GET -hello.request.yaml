$kind: http-request
name: GET /hello
url: "{{baseUrl}}/hello"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("body", () => pm.expect(pm.response.text()).to.eql("hello world"));
    language: text/javascript
order: 3000

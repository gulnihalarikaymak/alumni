$kind: http-request
name: GET /sum/:a/:b
url: "{{baseUrl}}/sum/3/4"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("3 + 4 = 7", () => pm.expect(pm.response.text()).to.eql("7"));
    language: text/javascript
order: 5000

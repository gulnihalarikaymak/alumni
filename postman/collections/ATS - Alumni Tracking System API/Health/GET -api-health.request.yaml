$kind: http-request
name: GET /api/health
description: Health check. Returns JSON in Postman; opens a status page in the browser.
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("status is ok", () => pm.expect(pm.response.json().status).to.eql("ok"));
    language: text/javascript
order: 1000

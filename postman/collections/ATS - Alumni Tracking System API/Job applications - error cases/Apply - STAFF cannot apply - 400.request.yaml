$kind: http-request
name: Apply - STAFF cannot apply -> 400
url: "{{baseUrl}}/api/job-postings/{{appPostingId}}/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicantId": {{staffId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 11000

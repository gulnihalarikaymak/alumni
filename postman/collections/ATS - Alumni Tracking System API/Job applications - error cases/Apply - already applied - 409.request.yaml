$kind: http-request
name: Apply - already applied -> 409
url: "{{baseUrl}}/api/job-postings/{{appPostingId}}/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicantId": {{applicantId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 13000

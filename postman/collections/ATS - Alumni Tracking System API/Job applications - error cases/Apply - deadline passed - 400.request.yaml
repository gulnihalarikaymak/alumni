$kind: http-request
name: Apply - deadline passed -> 400
url: "{{baseUrl}}/api/job-postings/{{expiredPostingId}}/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicantId": {{applicantId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000

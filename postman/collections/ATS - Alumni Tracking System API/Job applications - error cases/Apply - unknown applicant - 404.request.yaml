$kind: http-request
name: Apply - unknown applicant -> 404
url: "{{baseUrl}}/api/job-postings/{{appPostingId}}/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicantId": 999999
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 10000

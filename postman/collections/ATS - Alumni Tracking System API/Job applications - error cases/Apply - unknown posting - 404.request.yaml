$kind: http-request
name: Apply - unknown posting -> 404
url: "{{baseUrl}}/api/job-postings/999999/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicantId": {{applicantId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 6000

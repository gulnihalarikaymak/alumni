$kind: http-request
name: Setup - apply (valid) -> 201
url: "{{baseUrl}}/api/job-postings/{{appPostingId}}/applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicantId": {{applicantId}},
      "coverLetter": "Postman test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("applicationId", pm.response.json().id);
    language: text/javascript
order: 5000

$kind: http-request
name: Create - impossible deadline -> 400
url: "{{baseUrl}}/api/job-postings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Junior Developer",
      "company": "Example Ltd",
      "workType": "REMOTE",
      "employmentType": "FULL_TIME",
      "description": "Synthetic posting for Postman tests",
      "deadline": "2026-02-30"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000

$kind: http-request
name: Register - ADMIN role -> 400
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "register-admin-{{$timestamp}}@example.com",
      "password": "test-password-1",
      "role": "ADMIN",
      "acceptPrivacy": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000

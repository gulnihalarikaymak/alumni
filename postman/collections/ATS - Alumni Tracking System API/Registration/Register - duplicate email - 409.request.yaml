$kind: http-request
name: Register - duplicate email -> 409
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registeredEmail}}",
      "role": "STAFF",
      "acceptPrivacy": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000

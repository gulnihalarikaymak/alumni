$kind: http-request
name: Register - graduate with profile -> 201
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "register-alumni-{{$timestamp}}@example.com",
      "password": "test-password-1",
      "role": "ALUMNI",
      "acceptPrivacy": true,
      "fullName": "Deniz Kaya",
      "graduationYear": 2019,
      "city": "İzmir"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test("alumni profile is created", () => pm.expect(r.alumniProfile.graduationYear).to.eql(2019));
      pm.collectionVariables.set("registeredAlumniId", r.user.id);
    language: text/javascript
order: 2000

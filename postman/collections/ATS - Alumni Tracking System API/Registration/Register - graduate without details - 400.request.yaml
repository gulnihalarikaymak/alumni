$kind: http-request
name: Register - graduate without details -> 400
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "register-nodetails-{{$timestamp}}@example.com",
      "role": "ALUMNI",
      "acceptPrivacy": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000

$kind: http-request
name: Register - graduation year in the future -> 400
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "register-future-{{$timestamp}}@example.com",
      "password": "test-password-1",
      "role": "ALUMNI",
      "acceptPrivacy": true,
      "fullName": "Deniz Kaya",
      "graduationYear": 2999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000

$kind: http-request
name: Register - privacy not accepted -> 400
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "register-noconsent-{{$timestamp}}@example.com",
      "role": "STUDENT",
      "acceptPrivacy": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000

$kind: http-request
name: Register - student -> 201
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "register-student-{{$timestamp}}@example.com",
      "password": "test-password-1",
      "role": "STUDENT",
      "acceptPrivacy": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test("account starts as PENDING", () => pm.expect(r.user.status).to.eql("PENDING"));
      pm.test("no alumni profile", () => pm.expect(r.alumniProfile).to.eql(null));
      pm.collectionVariables.set("registeredStudentId", r.user.id);
      pm.collectionVariables.set("registeredEmail", r.user.email);
    language: text/javascript
order: 1000

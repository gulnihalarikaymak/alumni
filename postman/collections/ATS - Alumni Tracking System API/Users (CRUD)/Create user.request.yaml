$kind: http-request
description: "Creates a user in memory. Saves the new id to {{userId}} for the next requests. role: ADMIN | STAFF | ALUMNI | STUDENT"
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "recep@gmail.com",
      "role": "ALUMNI"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      const u = pm.response.json();
      pm.test("status starts as PENDING", () => pm.expect(u.status).to.eql("PENDING"));
      pm.collectionVariables.set("userId", u.id);
      pm.collectionVariables.set("userEmail", u.email);
    language: text/javascript
order: 1000

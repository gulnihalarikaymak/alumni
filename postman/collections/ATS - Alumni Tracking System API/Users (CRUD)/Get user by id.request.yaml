$kind: http-request
url: "{{baseUrl}}/api/users/{{userId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("same id", () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("userId"))));
    language: text/javascript
order: 3000

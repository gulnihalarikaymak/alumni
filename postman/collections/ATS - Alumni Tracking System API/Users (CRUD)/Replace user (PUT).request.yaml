$kind: http-request
description: "Full replacement: email, role and status are all required. status: PENDING | ACTIVE | REJECTED | SUSPENDED"
url: "{{baseUrl}}/api/users/{{userId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{$randomEmail}}",
      "role": "STAFF",
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const u = pm.response.json();
      pm.test("fields replaced", () => { pm.expect(u.role).to.eql("STAFF"); pm.expect(u.status).to.eql("ACTIVE"); });
      pm.collectionVariables.set("userEmail", u.email);
    language: text/javascript
order: 4000

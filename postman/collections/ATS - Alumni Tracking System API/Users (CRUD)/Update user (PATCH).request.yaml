$kind: http-request
description: "Partial update: send any of email, role, status."
url: "{{baseUrl}}/api/users/{{userId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "SUSPENDED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("status updated", () => pm.expect(pm.response.json().status).to.eql("SUSPENDED"));
    language: text/javascript
order: 5000

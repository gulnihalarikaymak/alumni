$kind: http-request
name: Create - invalid body -> 400
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "not-an-email",
      "role": "KING"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 1000

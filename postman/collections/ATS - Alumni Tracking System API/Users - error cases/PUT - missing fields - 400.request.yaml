$kind: http-request
name: PUT - missing fields -> 400
url: "{{baseUrl}}/api/users/{{dupId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "STAFF"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
